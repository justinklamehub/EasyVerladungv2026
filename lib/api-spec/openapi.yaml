openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: COMET LKW-Verladungsverwaltung API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: speditionen
    description: Freight company management
  - name: shipments
    description: Truck loading management (Verladungen)
  - name: pallets
    description: Pallet account management
  - name: reconciliations
    description: Pallet reconciliation management
  - name: dashboard
    description: Dashboard statistics
  - name: audit
    description: Audit log
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /wvvn/state:
    get:
      operationId: getWvvnState
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Module data limited by permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnState" }
  /wvvn/scanner/state:
    get:
      operationId: getWvvnScannerState
      responses:
        "200":
          description: Current device and own open lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnScannerState" }
  /wvvn/scanner/unlock:
    post:
      operationId: unlockWvvnScanner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnDeviceInput" }
      responses:
        "200":
          description: Scanner authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnScannerState" }
  /wvvn/scanner/lock:
    post:
      operationId: lockWvvnScanner
      responses:
        "204": { description: Scanner locked }
  /wvvn/devices/{id}:
    delete:
      operationId: revokeWvvnDevice
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Device revoked }
  /wvvn/scanner/lookup:
    get:
      operationId: lookupWvvnArticle
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: sessionId, in: query, required: true, schema: { type: integer } }
        - { name: inputMethod, in: query, required: true, schema: { type: string, enum: [scan, manual] } }
      responses:
        "200":
          description: Unambiguous article match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnLookup" }
  /wvvn/scanner/sessions:
    post:
      operationId: createWvvnSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnSessionInput" }
      responses:
        "200":
          description: Existing or new own open list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSession" }
  /wvvn/sessions/{id}:
    delete:
      operationId: deleteWvvnSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnSessionDeletion" }
      responses:
        "204": { description: Completed list removed with revision check and audit; sent reports unchanged }
    put:
      operationId: updateWvvnSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnSessionEdit" }
      responses:
        "200":
          description: Authorized correction of a completed list with optimistic locking and audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSession" }
    get:
      operationId: getWvvnSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List with positions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSession" }
  /wvvn/scanner/sessions/{id}/items:
    post:
      operationId: addWvvnItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnItemInput" }
      responses:
        "200":
          description: List after idempotent addition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSession" }
  /wvvn/scanner/sessions/{id}/items/{itemId}:
    delete:
      operationId: deleteWvvnItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated own open list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSession" }
  /wvvn/scanner/sessions/{id}/finalize:
    post:
      operationId: finalizeWvvnSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Closed immutable list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSession" }
  /wvvn/settings:
    put:
      operationId: updateWvvnSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnSettings" }
      responses:
        "200":
          description: Saved module settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnSettings" }
  /wvvn/articles/{id}:
    put:
      operationId: updateWvvnArticle
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnArticleInput" }
      responses:
        "200":
          description: Shared warehouse article updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnArticle" }
  /wvvn/import/preview:
    post:
      operationId: previewWvvnImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnImportInput" }
      responses:
        "200":
          description: Non-mutating SQL data preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnImportPreview" }
  /wvvn/import/commit:
    post:
      operationId: commitWvvnImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WvvnImportInput" }
      responses:
        "200":
          description: Transactional import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WvvnImportPreview" }
  /wvvn/reports/send:
    post:
      operationId: sendWvvnReports
      responses:
        "200":
          description: Pending report processing outcome
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /wvvn/sessions/{id}/csv:
    get:
      operationId: downloadWvvnSessionCsv
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Aggregated CSV
          content:
            text/csv:
              schema: { type: string }
  /wvvn/reports/{id}/csv:
    get:
      operationId: downloadWvvnReportCsv
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Immutable report CSV
          content:
            text/csv:
              schema: { type: string }
  /pallet-purchases:
    get:
      operationId: listPalletPurchases
      parameters:
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: COMET-owned purchase records, never customer account movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PalletPurchase" }
    post:
      operationId: createPalletPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PalletPurchaseInput" }
      responses:
        "201":
          description: Purchased pallets recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PalletPurchase" }
  /pallet-purchases/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updatePalletPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PalletPurchaseInput" }
      responses:
        "200":
          description: Purchase updated with version check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PalletPurchase" }
    delete:
      operationId: deletePalletPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PalletPurchaseDeletion" }
      responses:
        "204": { description: Purchase deleted with version check }
  /stempeluhr/state:
    get:
      operationId: getStempeluhrState
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: employeeId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Permission-scoped employees, entries and audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockState" }
  /stempeluhr/shift-planning:
    get:
      operationId: getClockShiftPlanning
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: employeeId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Shift templates, assignments, exceptions and calculated daily planning (at most 62 days)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShiftPlanning" }
  /stempeluhr/shifts:
    post:
      operationId: createClockShift
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftInput" }
      responses:
        "201":
          description: Created shift template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShift" }
  /stempeluhr/shifts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateClockShift
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftUpdate" }
      responses:
        "200":
          description: Updated template (existing bookings retain their snapshot)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShift" }
    delete:
      operationId: deleteClockShift
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockVersion" }
      responses:
        "204": { description: Unused shift template removed; referenced templates cannot be deleted }
  /stempeluhr/shift-assignments:
    post:
      operationId: createClockShiftAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftAssignmentInput" }
      responses:
        "201":
          description: Employee assignment with weekly cycle anchored to the Monday of startsOn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShiftAssignment" }
  /stempeluhr/shift-assignments/bulk:
    post:
      operationId: createClockShiftAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftAssignmentsInput" }
      responses:
        "200":
          description: All assignments saved atomically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClockShiftAssignment" }
  /stempeluhr/shift-assignments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateClockShiftAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftAssignmentUpdate" }
      responses:
        "200":
          description: Updated assignment, existing bookings unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShiftAssignment" }
    delete:
      operationId: deleteClockShiftAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockVersion" }
      responses:
        "204": { description: "Assignment removed, existing bookings unchanged" }
  /stempeluhr/shift-exceptions:
    post:
      operationId: createClockShiftException
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftExceptionInput" }
      responses:
        "201":
          description: Explicit shift or day-off exception, higher priority than weekly rotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShiftException" }
  /stempeluhr/shift-exceptions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateClockShiftException
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockShiftExceptionUpdate" }
      responses:
        "200":
          description: Updated exception, existing bookings unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockShiftException" }
    delete:
      operationId: deleteClockShiftException
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockVersion" }
      responses:
        "204": { description: Exception removed; normal rotation resumes }
  /stempeluhr/employees:
    post:
      operationId: createClockEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockEmployeeCreateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockEmployee" }
  /stempeluhr/employees/next-card-number:
    get:
      operationId: getNextClockCardNumber
      responses:
        "200":
          description: Preview only; the final card number is allocated atomically on creation.
          content:
            application/json:
              schema:
                type: object
                required: [cardNumber]
                properties:
                  cardNumber: { type: string }
  /stempeluhr/employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateClockEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockEmployeeInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockEmployee" }
    delete:
      operationId: deleteClockEmployee
      responses:
        "204": { description: Deleted only if no attendance history }
  /stempeluhr/entries:
    post:
      operationId: createClockEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockEntry" }
  /stempeluhr/entries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: updateClockEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockEntryUpdate" }
      responses:
        "200":
          description: Corrected with audit and optimistic locking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockEntry" }
    delete:
      operationId: deleteClockEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockDeletion" }
      responses:
        "204": { description: Soft deleted with audit }
  /stempeluhr/settings:
    get:
      operationId: getClockSettings
      responses:
        "200":
          description: Time calculation and terminal configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockSettings" }
    put:
      operationId: updateClockSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockSettings" }
      responses:
        "200":
          description: Saved, applies to newly created attendance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockSettings" }
  /stempeluhr/import/preview:
    post:
      operationId: previewClockImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockImportInput" }
      responses:
        "200":
          description: Validation and non-destructive duplicate detection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockImportResult" }
  /stempeluhr/import/commit:
    post:
      operationId: commitClockImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockImportInput" }
      responses:
        "200":
          description: Atomic import, existing records not overwritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockImportResult" }
  /stempeluhr/terminal/status:
    get:
      operationId: getClockTerminal
      responses:
        "200":
          description: Status of this device only, no employee directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockTerminal" }
  /stempeluhr/terminal/unlock:
    post:
      operationId: unlockClockTerminal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockTerminalInput" }
      responses:
        "200":
          description: Dedicated HTTP-only cookie, no account access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockTerminal" }
  /stempeluhr/terminal/lock:
    post:
      operationId: lockClockTerminal
      responses:
        "204": { description: This device locked and cookie revoked }
  /stempeluhr/terminal/stamp:
    post:
      operationId: stampClockTerminal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockStampInput" }
      responses:
        "200":
          description: Transactional clock in or clock out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockStampResult" }
  /stempeluhr/terminals:
    get:
      operationId: getClockTerminals
      responses:
        "200":
          description: Active terminals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClockTerminal" }
  /stempeluhr/terminals/{id}:
    delete:
      operationId: revokeClockTerminal
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
  /user-preferences/shipments_work_views:
    get:
      operationId: getShipmentWorkViews
      tags: [shipments]
      summary: Persönliche Arbeitsansichten des angemeldeten Benutzers
      responses:
        "200":
          description: Gespeicherte Ansichten oder eine leere Sammlung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentWorkViewsPreference" }
        "401": { description: Anmeldung erforderlich }
        "422": { description: Gespeicherte Daten ungültig }
    put:
      operationId: putShipmentWorkViews
      tags: [shipments]
      summary: Persönliche Arbeitsansichten mit Versionsprüfung speichern
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentWorkViewsPreferenceInput" }
      responses:
        "200":
          description: Gespeicherte Sammlung mit erhöhter Revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentWorkViewsPreferenceResult" }
        "400": { description: Ungültige Ansichten }
        "401": { description: Anmeldung erforderlich }
        "409": { description: Sammlung zwischenzeitlich geändert }
        "500": { description: Speicherung fehlgeschlagen }
  /admin/system/operations:
    get:
      operationId: getAdminSystemOperations
      tags: [health]
      summary: Update-Fortschritt und letzte gemeinsame Sicherung
      responses:
        "200":
          description: Gespeicherter Betriebsstatus ohne Ausführung eines Skripts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOperationsReport"
        "401": { description: Anmeldung erforderlich }
        "403": { description: System-Anzeigerecht erforderlich }
  /admin/system/update:
    post:
      operationId: startAdminSystemUpdate
      tags: [health]
      summary: Bestätigtes Update als unabhängigen Hintergrundauftrag starten
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemUpdateConfirmation"
      responses:
        "202":
          description: Hintergrundauftrag angenommen; noch nicht abgeschlossen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateAccepted"
        "400": { description: Bestätigung fehlt }
        "403": { description: System-Anzeige-/Update-Recht oder gültige Herkunft fehlt }
        "409": { description: Update läuft bereits }
        "503": { description: Sicherer Updater ist nicht eingerichtet }
  /admin/system/status:
    get:
      operationId: getAdminSystemStatus
      tags: [health]
      summary: Rein lesende Systemprüfungen mit konfigurierbarem System-Anzeigerecht
      responses:
        "200":
          description: Prüfbericht mit tatsächlichen Ergebnissen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusReport"
        "401":
          description: Anmeldung erforderlich
        "403":
          description: System-Anzeigerecht erforderlich
  /report/delivery/preview:
    get:
      operationId: previewDeliveryReport
      responses:
        "200":
          description: Aktuelle Liefertermin-Mail ohne Versand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReportPreview"
        "403":
          description: Nur Administratoren
  /report/delivery/send:
    post:
      operationId: sendDeliveryReport
      responses:
        "200":
          description: Prüfergebnis (Versand nur bei kritischen Terminen)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReportResult"
        "400":
          description: Ungültige Mailkonfiguration
        "403":
          description: Nur Administratoren
        "500":
          description: Versand fehlgeschlagen
  /einlagerung/scanner/state:
    get:
      operationId: getScannerEinlagerungState
      tags: [einlagerung]
      security: []
      responses:
        "200":
          description: Öffentliche Scanner-Daten ohne Ereignisprotokoll und Importhistorie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungState"
  /einlagerung/scanner/search:
    get:
      operationId: searchScannerEinlagerung
      tags: [einlagerung]
      security: []
      parameters:
        - {name: mode, in: query, required: true, schema: {type: string, enum: [artikel, auftraege]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: shelfId, in: query, schema: {type: integer}}
        - {name: spedition, in: query, schema: {type: string}}
