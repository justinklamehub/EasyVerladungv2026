        expectedShipments:
          type: integer
        arrivedShipments:
          type: integer
        openShipments:
          type: integer
        lateShipments:
          type: integer
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        bySpedition:
          type: array
          items:
            $ref: "#/components/schemas/SpeditionCount"
        palletBalances:
          type: array
          items:
            $ref: "#/components/schemas/PalletBalance"
        openReconciliations:
          type: integer
        analytics:
          $ref: "#/components/schemas/DashboardAnalytics"

    DashboardAnalytics:
      type: object
      required: [dateFrom, dateTo, grain, activity, unplacedEta, unplacedAta, byLkwArt, punctuality]
      properties:
        dateFrom:
          type: string
        dateTo:
          type: string
        grain:
          type: string
          enum: [hour, day]
        activity:
          type: array
          items:
            $ref: "#/components/schemas/DashboardActivityPoint"
        unplacedEta:
          type: integer
        unplacedAta:
          type: integer
        byLkwArt:
          type: array
          items:
            $ref: "#/components/schemas/DashboardLkwArtCount"
        punctuality:
          $ref: "#/components/schemas/DashboardPunctuality"

    DashboardActivityPoint:
      type: object
      required: [label, eta, ata]
      properties:
        label:
          type: string
        eta:
          type: integer
        ata:
          type: integer

    DashboardLkwArtCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer

    DashboardPunctuality:
      type: object
      required: [onTime, delayed, unknown, onTimePercent]
      properties:
        onTime:
          type: integer
        delayed:
          type: integer
        unknown:
          type: integer
        onTimePercent:
          type: ["number", "null"]

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    SpeditionCount:
      type: object
      required: [speditionId, speditionName, count]
      properties:
        speditionId:
          type: integer
        speditionName:
          type: string
        count:
          type: integer

    AuditEntry:
      type: object
      required: [id, module, recordId, changedAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        username:
          type: ["string", "null"]
        module:
          type: string
        recordId:
          type: integer
        field:
          type: ["string", "null"]
        oldValue:
          type: ["string", "null"]
        newValue:
          type: ["string", "null"]
        changedAt:
          type: string

    AuditLogPage:
      type: object
      required: [entries, total, page, limit]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
