            type: ["string", "null"]
        - name: recordId
          in: query
          schema:
            type: ["integer", "null"]
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    ShipmentWorkViewDateRange:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [today, tomorrow, thisWeek, all] }
        - type: object
          additionalProperties: false
          required: [mode, from, to]
          properties:
            mode: { type: string, enum: [custom] }
            from: { type: string, pattern: '^(?:[1-9]\d{3}-\d{2}-\d{2})?$' }
            to: { type: string, pattern: '^(?:[1-9]\d{3}-\d{2}-\d{2})?$' }
    ShipmentWorkViewFilterValues:
      type: object
      additionalProperties: false
      required: [search, status, speditionId, lkwArt, tor, date, sortField, sortDir, showAbgefertigt, showStorniert]
      properties:
        search: { type: string, maxLength: 200 }
        status: { type: string, enum: ["__all__", Angemeldet, Erwartet, Angekommen, "in Verladung", Verladen, Abgefertigt, Storniert] }
        speditionId: { type: string, pattern: '^(?:__all__|[1-9]\d{0,9})$' }
        lkwArt: { type: string, minLength: 1, maxLength: 100 }
        tor: { type: string, minLength: 1, maxLength: 100 }
        date: { $ref: "#/components/schemas/ShipmentWorkViewDateRange" }
        sortField: { type: string, enum: [kennzeichen, etaDate, status, tor, speditionName] }
        sortDir: { type: string, enum: [asc, desc] }
        showAbgefertigt: { type: boolean }
        showStorniert: { type: boolean }
    ShipmentWorkViewEntry:
      type: object
      additionalProperties: false
      required: [id, name, filters]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        filters: { $ref: "#/components/schemas/ShipmentWorkViewFilterValues" }
    ShipmentWorkViewsCollection:
      type: object
      additionalProperties: false
      required: [version, revision, views]
      properties:
        version: { type: integer, enum: [1] }
        revision: { type: integer, minimum: 0, maximum: 2147483647 }
        views:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/ShipmentWorkViewEntry" }
    ShipmentWorkViewsPreference:
      type: object
      required: [value]
      properties:
        value: { $ref: "#/components/schemas/ShipmentWorkViewsCollection" }
    ShipmentWorkViewsPreferenceInput:
      type: object
      required: [value]
      properties:
        value: { $ref: "#/components/schemas/ShipmentWorkViewsCollection" }
    ShipmentWorkViewsPreferenceResult:
      type: object
      required: [ok, value]
      properties:
        ok: { type: boolean }
        value: { $ref: "#/components/schemas/ShipmentWorkViewsCollection" }
    SystemUpdateConfirmation:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean }
    SystemUpdateAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }
    SystemOperationsReport:
      type: object
      required: [available, reason, update, backup]
      properties:
        available: { type: boolean }
        reason: { type: [string, "null"] }
        update:
          $ref: "#/components/schemas/SystemUpdateProgress"
        backup:
          anyOf:
            - $ref: "#/components/schemas/SystemBackupSummary"
            - type: "null"
    SystemUpdateProgress:
      type: object
      required: [jobId, status, phase, message, startedAt, finishedAt, events]
      properties:
        jobId: { type: [string, "null"] }
        status:
          type: string
          enum: [idle, queued, running, done, failed, unknown]
        phase: { type: string }
        message: { type: string }
        recovery:
          type: [string, "null"]
          enum: [preserved, failed, null]
          description: Previous builds retained/restored, or automatic recovery failed. Not a database rollback.
        diagnostic:
          anyOf:
            - $ref: "#/components/schemas/SystemUpdateDiagnostic"
            - type: "null"
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        events:
          type: array
          items:
            $ref: "#/components/schemas/SystemOperationEvent"
    SystemUpdateDiagnostic:
      type: object
      required: [code, cause, nextSteps]
      properties:
        code:
          type: string
          enum: [ERR_PNPM_IGNORED_BUILDS, ERR_PNPM_OUTDATED_LOCKFILE, ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE, UNKNOWN]
        cause: { type: string }
        nextSteps:
          type: array
          items: { type: string }
    SystemOperationEvent:
      type: object
      required: [phase, message, at]
      properties:
        phase: { type: string }
        message: { type: string }
        at: { type: string, format: date-time }
    SystemBackupSummary:
      type: object
      required: [id, createdAt, imageCount, tableCount, backend, verifiedAt]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        imageCount: { type: integer, minimum: 0 }
        tableCount: { type: integer, minimum: 0 }
        backend: { type: string, enum: [local, gcs] }
        verifiedAt: { type: [string, "null"], format: date-time }
    SystemCheckStatus:
      type: string
      enum: [ok, warning, error]
    SystemStatusCheck:
      type: object
      required: [id, title, status, message, durationMs, details]
      properties:
        id:
          type: string
          enum: [frontend, api, database, storage]
        title:
          type: string
        status:
          $ref: "#/components/schemas/SystemCheckStatus"
        message:
          type: string
        durationMs:
          type: integer
        details:
          type: array
          items:
            type: string
    SystemStatusReport:
      type: object
      required: [checkedAt, overall, environment, hostname, nodeVersion, uptimeSeconds, checks]
      properties:
        checkedAt:
          type: string
          format: date-time
        overall:
          $ref: "#/components/schemas/SystemCheckStatus"
        environment:
          type: string
          enum: [development, production, test]
        hostname:
          type: string
        nodeVersion:
          type: string
        uptimeSeconds:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SystemStatusCheck"
    DeliveryReportPreview:
      type: object
      required: [subject, html, text, criticalCount, ordersCount, dueCount, warningDays]
      properties:
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        criticalCount: { type: integer }
        ordersCount: { type: integer }
        dueCount: { type: integer }
        warningDays: { type: integer }
    DeliveryReportResult:
      type: object
      required: [ok, sent, message]
      properties:
        ok: { type: boolean }
        sent: { type: boolean }
        message: { type: string }
    EinlagerungShelfStatusInput:
      type: object
      required: [full]
      properties:
        full: {type: boolean}
        note: {type: string}
    EinlagerungRecord:
      type: object
      required: [id, kind, data, updatedAt]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [hall, aisle, shelf, article, group, rule, reservation, carrier]}
        data: {type: object, additionalProperties: true}
        updatedAt: {type: string}
    EinlagerungRecordInput:
      type: object
      required: [data]
      properties:
        data: {type: object, additionalProperties: true}
        expectedUpdatedAt: {type: string}
    EinlagerungSettings:
      type: object
      required: [hideFull, staleHours, profiles, colors]
      properties:
        hideFull: {type: boolean}
        staleHours: {type: integer, minimum: 1, maximum: 8760}
        profiles: {type: object, additionalProperties: true}
        deadlineThresholds:
          $ref: "#/components/schemas/EinlagerungDeadlineThresholds"
        colors:
          type: object
          required: [free, occupied, full]
          properties:
            free: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
            occupied: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
            full: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    EinlagerungDeadlineThresholds:
      type: object
      description: "Aufsteigende Tagesgrenzen: criticalDays < soonDays < upcomingDays."
      required: [criticalDays, soonDays, upcomingDays]
      properties:
        criticalDays: {type: integer, minimum: 0, maximum: 3650}
        soonDays: {type: integer, minimum: 1, maximum: 3650}
        upcomingDays: {type: integer, minimum: 2, maximum: 3650}
    EinlagerungDataset:
      type: object
      required: [id, type, filename, importedAt, importedBy, rowCount]
      properties:
        id: {type: integer}
        type: {type: string}
        filename: {type: string}
        importedAt: {type: string}
        importedBy: {type: string}
        rowCount: {type: integer}
    EinlagerungState:
      type: object
      required: [records, datasets, settings, occupancy, events, speditionen]
      properties:
        records:
          type: array
          items: {$ref: "#/components/schemas/EinlagerungRecord"}
        datasets:
          type: array
          items: {$ref: "#/components/schemas/EinlagerungDataset"}
        settings: {$ref: "#/components/schemas/EinlagerungSettings"}
        occupancy:
          type: array
          items:
            type: object
            required: [shelf, ist, retouren, auftraege]
            properties:
              shelf: {type: string}
              ist: {type: integer}
              retouren: {type: integer}
              auftraege: {type: integer}
        events:
          type: array
          items:
            type: object
            required: [id, action, createdAt, username, detail]
            properties:
              id: {type: integer}
              action: {type: string}
              createdAt: {type: string}
              username: {type: string}
              detail: {type: string}
        speditionen:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer}
              name: {type: string}
    EinlagerungSearchResult:
      type: object
      required: [locations, orders, reservations, message]
      properties:
        article: {$ref: "#/components/schemas/EinlagerungRecord"}
        message: {type: string}
        locations:
          type: array
          items:
            type: object
            required: [shelf, priority, note, group, color, ist, retouren, orders]
            properties:
              shelf: {$ref: "#/components/schemas/EinlagerungRecord"}
              priority: {type: integer}
              note: {type: string}
              group: {type: string}
              color: {type: string}
              ist: {type: array, items: {type: object, additionalProperties: true}}
              retouren: {type: array, items: {type: object, additionalProperties: true}}
              orders: {type: array, items: {type: object, additionalProperties: true}}
        orders: {type: array, items: {type: object, additionalProperties: true}}
        reservations:
          type: array
          items: {$ref: "#/components/schemas/EinlagerungRecord"}
    EinlagerungImportInput:
      type: object
      required: [type, csv, filename, mode]
      properties:
        type: {type: string, enum: [strategie, istbestand, retouren, auftraege, artikel]}
        csv: {type: string}
        filename: {type: string}
        mode: {type: string, enum: [replace, merge]}
        mapping: {type: object, additionalProperties: {type: integer, minimum: 0}}
    EinlagerungImportPreview:
      type: object
      required: [valid, rowCount, headers, sample, errors, warnings]
      properties:
        valid: {type: boolean}
        rowCount: {type: integer}
        headers: {type: array, items: {type: string}}
        sample: {type: array, items: {type: object, additionalProperties: true}}
        errors: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
