openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: COMET LKW-Verladungsverwaltung API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: speditionen
    description: Freight company management
  - name: shipments
    description: Truck loading management (Verladungen)
  - name: pallets
    description: Pallet account management
  - name: reconciliations
    description: Pallet reconciliation management
  - name: dashboard
    description: Dashboard statistics
  - name: audit
    description: Audit log
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /user-preferences/shipments_work_views:
    get:
      operationId: getShipmentWorkViews
      tags: [shipments]
      summary: Persönliche Arbeitsansichten des angemeldeten Benutzers
      responses:
        "200":
          description: Gespeicherte Ansichten oder eine leere Sammlung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentWorkViewsPreference" }
        "401": { description: Anmeldung erforderlich }
        "422": { description: Gespeicherte Daten ungültig }
    put:
      operationId: putShipmentWorkViews
      tags: [shipments]
      summary: Persönliche Arbeitsansichten mit Versionsprüfung speichern
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentWorkViewsPreferenceInput" }
      responses:
        "200":
          description: Gespeicherte Sammlung mit erhöhter Revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentWorkViewsPreferenceResult" }
        "400": { description: Ungültige Ansichten }
        "401": { description: Anmeldung erforderlich }
        "409": { description: Sammlung zwischenzeitlich geändert }
        "500": { description: Speicherung fehlgeschlagen }
  /admin/system/operations:
    get:
      operationId: getAdminSystemOperations
      tags: [health]
      summary: Update-Fortschritt und letzte gemeinsame Sicherung
      responses:
        "200":
          description: Gespeicherter Betriebsstatus ohne Ausführung eines Skripts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOperationsReport"
        "401": { description: Anmeldung erforderlich }
        "403": { description: System-Anzeigerecht erforderlich }
  /admin/system/update:
    post:
      operationId: startAdminSystemUpdate
      tags: [health]
      summary: Bestätigtes Update als unabhängigen Hintergrundauftrag starten
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemUpdateConfirmation"
      responses:
        "202":
          description: Hintergrundauftrag angenommen; noch nicht abgeschlossen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateAccepted"
        "400": { description: Bestätigung fehlt }
        "403": { description: System-Anzeige-/Update-Recht oder gültige Herkunft fehlt }
        "409": { description: Update läuft bereits }
        "503": { description: Sicherer Updater ist nicht eingerichtet }
  /admin/system/status:
    get:
      operationId: getAdminSystemStatus
      tags: [health]
      summary: Rein lesende Systemprüfungen mit konfigurierbarem System-Anzeigerecht
      responses:
        "200":
          description: Prüfbericht mit tatsächlichen Ergebnissen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusReport"
        "401":
          description: Anmeldung erforderlich
        "403":
          description: System-Anzeigerecht erforderlich
  /report/delivery/preview:
    get:
      operationId: previewDeliveryReport
      responses:
        "200":
          description: Aktuelle Liefertermin-Mail ohne Versand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReportPreview"
        "403":
          description: Nur Administratoren
  /report/delivery/send:
    post:
      operationId: sendDeliveryReport
      responses:
        "200":
          description: Prüfergebnis (Versand nur bei kritischen Terminen)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReportResult"
        "400":
          description: Ungültige Mailkonfiguration
        "403":
          description: Nur Administratoren
        "500":
          description: Versand fehlgeschlagen
  /einlagerung/scanner/state:
    get:
      operationId: getScannerEinlagerungState
      tags: [einlagerung]
      security: []
      responses:
        "200":
          description: Öffentliche Scanner-Daten ohne Ereignisprotokoll und Importhistorie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungState"
  /einlagerung/scanner/search:
    get:
      operationId: searchScannerEinlagerung
      tags: [einlagerung]
      security: []
      parameters:
        - {name: mode, in: query, required: true, schema: {type: string, enum: [artikel, auftraege]}}
        - {name: q, in: query, schema: {type: string}}
        - {name: shelfId, in: query, schema: {type: integer}}
        - {name: spedition, in: query, schema: {type: string}}
        - {name: relation, in: query, schema: {type: string}}
        - {name: termin, in: query, schema: {type: string}}
      responses:
        "200":
          description: Artikel- oder Auftragssuche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungSearchResult"
  /einlagerung/scanner/records/{kind}:
    post:
      operationId: createScannerEinlagerungRecord
      tags: [einlagerung]
      security: []
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [reservation]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungRecordInput"
      responses:
        "201":
          description: Reservierung angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungRecord"
  /einlagerung/scanner/records/{kind}/{id}:
    put:
      operationId: updateScannerEinlagerungRecord
      tags: [einlagerung]
      security: []
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [reservation]}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungRecordInput"
      responses:
        "200":
          description: Reservierung aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungRecord"
  /einlagerung/scanner/shelves/{id}/status:
    post:
      operationId: setScannerEinlagerungShelfStatus
      tags: [einlagerung]
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungShelfStatusInput"
      responses:
        "200":
          description: Vollmeldung oder Freigabe gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungRecord"
  /einlagerung/state:
    get:
      operationId: getEinlagerungState
      tags: [einlagerung]
      responses:
        "200":
          description: Lagerstruktur, Strategie, Vormerkungen und Importstände
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungState"
  /einlagerung/records/{kind}:
    post:
      operationId: createEinlagerungRecord
      tags: [einlagerung]
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungRecordInput"
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungRecord"
  /einlagerung/records/{kind}/{id}:
    put:
      operationId: updateEinlagerungRecord
      tags: [einlagerung]
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungRecordInput"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungRecord"
    delete:
      operationId: deleteEinlagerungRecord
      tags: [einlagerung]
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Gelöscht
          content:
            application/json:
              schema: {type: object, properties: {ok: {type: boolean}}, required: [ok]}
  /einlagerung/search:
    get:
      operationId: searchEinlagerung
      tags: [einlagerung]
      parameters:
        - {name: mode, in: query, required: true, schema: {type: string, enum: [artikel, auftraege, regal, lagerplan]}}
        - {name: groupByDelivery, in: query, description: Aufträge nach Lieferungsnummer getrennt aggregieren, schema: {type: boolean}}
        - {name: q, in: query, schema: {type: string}}
        - {name: shelfId, in: query, schema: {type: integer}}
        - {name: spedition, in: query, schema: {type: string}}
        - {name: relation, in: query, schema: {type: string}}
        - {name: termin, in: query, schema: {type: string}}
      responses:
        "200":
          description: Suchergebnis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungSearchResult"
  /einlagerung/shelves/{id}/status:
    post:
      operationId: setEinlagerungShelfStatus
      tags: [einlagerung]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungShelfStatusInput"
      responses:
        "200":
          description: Status gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungRecord"
  /einlagerung/settings:
    put:
      operationId: updateEinlagerungSettings
      tags: [einlagerung]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungSettings"
      responses:
        "200":
          description: Einstellungen gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungSettings"
  /einlagerung/import/preview:
    post:
      operationId: previewEinlagerungImport
      tags: [einlagerung]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungImportInput"
      responses:
        "200":
          description: Importprüfung ohne Datenänderung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungImportPreview"
  /einlagerung/import/commit:
    post:
      operationId: commitEinlagerungImport
      tags: [einlagerung]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EinlagerungImportInput"
      responses:
        "200":
          description: Vollständig geprüfter Import übernommen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EinlagerungDataset"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /push/recipients:
    get:
      operationId: listMessageRecipients
      tags: [push]
      summary: List recipients available to users with push.send_custom permission
      responses:
        "200":
          description: Recipient directory matching the existing global custom-message sending capability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageRecipient"
        "403":
          description: No permission to send custom messages
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: speditionId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete (deactivate) user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deactivated

  /speditionen:
    get:
      operationId: listSpeditionen
      tags: [speditionen]
      summary: List freight companies
      responses:
        "200":
          description: Speditionen list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Spedition"
    post:
      operationId: createSpedition
      tags: [speditionen]
      summary: Create freight company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeditionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spedition"

  /speditionen/{id}:
    get:
      operationId: getSpedition
      tags: [speditionen]
      summary: Get freight company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Spedition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spedition"
    patch:
      operationId: updateSpedition
      tags: [speditionen]
      summary: Update freight company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeditionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spedition"

  /speditionen/{id}/permissions:
    get:
      operationId: listSpeditionPermissions
      tags: [speditionen]
      summary: Get permissions granted by this spedition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeditionPermission"
    post:
      operationId: setSpeditionPermission
      tags: [speditionen]
      summary: Set permission for another spedition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeditionPermissionInput"
      responses:
        "200":
          description: Permission set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeditionPermission"

  /speditionen/{id}/permissions/{receivingId}:
    delete:
      operationId: revokeSpeditionPermission
      tags: [speditionen]
      summary: Revoke permission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: receivingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked

  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List shipments (Verladungen)
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - name: speditionId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: lkwArt
          in: query
          schema:
            type: ["string", "null"]
        - name: relation
          in: query
          schema:
            type: ["string", "null"]
        - name: kennzeichen
          in: query
          schema:
            type: ["string", "null"]
        - name: tor
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Shipments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
    post:
      operationId: createShipment
      tags: [shipments]
      summary: Create shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/bulk:
    post:
      operationId: bulkCreateShipments
      tags: [shipments]
      summary: Bulk create shipments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkShipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"

  /shipments/{id}:
    get:
      operationId: getShipment
      tags: [shipments]
      summary: Get shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
    patch:
      operationId: updateShipment
      tags: [shipments]
      summary: Update shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
    delete:
      operationId: deleteShipment
      tags: [shipments]
      summary: Delete shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /shipments/{id}/lock:
    post:
      operationId: lockShipment
      tags: [shipments]
      summary: Lock shipment for spedition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}/unlock:
    post:
      operationId: unlockShipment
      tags: [shipments]
      summary: Unlock shipment for spedition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}/history:
    get:
      operationId: getShipmentHistory
      tags: [shipments]
      summary: Get shipment change history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /pallet-movements:
    get:
      operationId: listPalletMovements
      tags: [pallets]
      summary: List pallet movements
      parameters:
        - name: speditionId
          in: query
          schema:
            type: ["integer", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - name: shipmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: palettenscheinnummer
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Pallet movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PalletMovement"
    post:
      operationId: createPalletMovement
      tags: [pallets]
      summary: Create pallet movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PalletMovementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PalletMovement"

  /pallet-movements/{id}:
    patch:
      operationId: updatePalletMovement
      tags: [pallets]
