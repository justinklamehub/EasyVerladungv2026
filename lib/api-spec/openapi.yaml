            type: ["string", "null"]
        - name: recordId
          in: query
          schema:
            type: ["integer", "null"]
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    WvvnMode:
      type: string
      enum: [WERKSVERKAUF, VERNICHTUNG]
    WvvnSessionInput:
      type: object
      required: [mode, netto, kware]
      properties:
        mode: { $ref: "#/components/schemas/WvvnMode" }
        netto: { type: boolean }
        kware: { type: boolean }
    WvvnItemInput:
      type: object
      required: [code, quantity, requestId, inputMethod]
      properties:
        inputMethod: { type: string, enum: [scan, manual] }
        code: { type: string, minLength: 1, maxLength: 150 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        requestId: { type: string, minLength: 16, maxLength: 100 }
    WvvnItem:
      type: object
      required: [id, articleNumber, articleName, scannedCode, unit, quantity, veFactor, pieces, createdAt]
      properties:
        id: { type: integer }
        articleNumber: { type: string }
        articleName: { type: string }
        scannedCode: { type: string }
        unit: { type: string, enum: [STK, VE] }
        quantity: { type: number }
        veFactor: { type: number }
        pieces: { type: number }
        createdAt: { type: string }
    WvvnSession:
      type: object
      required: [id, mode, netto, kware, status, actor, createdAt, finishedAt, itemCount, pieces, legacy, items, revision, reported]
      properties:
        revision: { type: integer }
        reported: { type: boolean }
        id: { type: integer }
        mode: { $ref: "#/components/schemas/WvvnMode" }
        netto: { type: boolean }
        kware: { type: boolean }
        status: { type: string, enum: [open, done] }
        actor: { type: string }
        createdAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        itemCount: { type: integer }
        pieces: { type: number }
        legacy: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/WvvnItem" } }
    WvvnSessionDeletion:
      type: object
      required: [revision, reason, acknowledgeReported]
      properties:
        revision: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        acknowledgeReported: { type: boolean }
    WvvnSessionEdit:
      type: object
      required: [revision, mode, netto, kware, reason, items, acknowledgeReported]
      properties:
        revision: { type: integer, minimum: 0 }
        mode: { $ref: "#/components/schemas/WvvnMode" }
        netto: { type: boolean }
        kware: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        acknowledgeReported: { type: boolean }
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            required: [quantity]
            properties:
              id: { type: integer }
              code: { type: string, minLength: 1, maxLength: 150 }
              quantity: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
    WvvnArticleInput:
      type: object
      required: [number, name, ean, veEan, veFactor, active, expectedUpdatedAt]
      properties:
        number: { type: string, minLength: 1, maxLength: 150 }
        name: { type: string, maxLength: 255 }
        ean: { type: string, maxLength: 100 }
        veEan: { type: string, maxLength: 100 }
        veFactor: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        active: { type: boolean }
        expectedUpdatedAt: { type: string }
    WvvnArticle:
      type: object
      required: [id, number, name, ean, veEan, veFactor, active, updatedAt]
      properties:
        id: { type: integer }
        number: { type: string }
        name: { type: string }
        ean: { type: string }
        veEan: { type: string }
        veFactor: { type: number }
        active: { type: boolean }
        updatedAt: { type: string }
        legacyEan: { type: string }
        legacyVeEan: { type: string }
        importNote: { type: string }
    WvvnLookup:
      type: object
      required: [article, unit, autoAdd]
      properties:
        article: { $ref: "#/components/schemas/WvvnArticle" }
        unit: { type: string, enum: [STK, VE] }
        autoAdd: { type: boolean }
    WvvnSettings:
      type: object
      required: [autoAddEan, defaultKware, deviceHours, mailEnabled, mailTime, salesRecipients, destructionRecipients]
      properties:
        autoAddEan: { type: boolean }
        defaultKware: { type: boolean }
        deviceHours: { type: ["integer", "null"], minimum: 1, maximum: 8760 }
        mailEnabled: { type: boolean }
        mailTime: { type: string, pattern: "^00:00$" }
        salesRecipients: { type: string, maxLength: 2000 }
        destructionRecipients: { type: string, maxLength: 2000 }
    WvvnDeviceInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
    WvvnDevice:
      type: object
      required: [id, label, expiresAt, revokedAt, createdAt]
      properties:
        id: { type: integer }
        label: { type: string }
        expiresAt: { type: ["string", "null"] }
        revokedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    WvvnScannerState:
      type: object
      required: [unlocked, device, sessions, autoAddEan, defaultKware]
      properties:
        unlocked: { type: boolean }
        device: { oneOf: [{ $ref: "#/components/schemas/WvvnDevice" }, { type: "null" }] }
        sessions: { type: array, items: { $ref: "#/components/schemas/WvvnSession" } }
        autoAddEan: { type: boolean }
        defaultKware: { type: boolean }
    WvvnReport:
      type: object
      required: [id, mode, reportDate, runningNo, status, sentAt, error, legacy]
      properties:
        id: { type: integer }
        mode: { $ref: "#/components/schemas/WvvnMode" }
        reportDate: { type: string }
        runningNo: { type: integer }
        status: { type: string }
        sentAt: { type: ["string", "null"] }
        error: { type: string }
        legacy: { type: boolean }
    WvvnEvent:
      type: object
      required: [id, actor, action, detail, createdAt]
      properties:
        id: { type: integer }
        actor: { type: string }
        action: { type: string }
        detail: { type: string }
        createdAt: { type: string }
    WvvnState:
      type: object
      required: [sessions, articles, reports, devices, events, settings, truncated]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/WvvnSession" } }
        articles: { type: array, items: { $ref: "#/components/schemas/WvvnArticle" } }
        reports: { type: array, items: { $ref: "#/components/schemas/WvvnReport" } }
        devices: { type: array, items: { $ref: "#/components/schemas/WvvnDevice" } }
        events: { type: array, items: { $ref: "#/components/schemas/WvvnEvent" } }
        settings: { oneOf: [{ $ref: "#/components/schemas/WvvnSettings" }, { type: "null" }] }
        truncated: { type: boolean }
    WvvnImportInput:
      type: object
      required: [sql]
      properties:
        sql: { type: string, minLength: 1, maxLength: 20000000 }
        previewHash: { type: string }
    WvvnImportPreview:
      type: object
      required: [articles, sessions, items, reports, openSessions, conflicts, warnings, alreadyImported, previewHash]
      properties:
        articles: { type: integer }
        sessions: { type: integer }
        items: { type: integer }
        reports: { type: integer }
        openSessions: { type: integer }
        conflicts: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        alreadyImported: { type: boolean }
        previewHash: { type: string }
    PalletPurchaseInput:
      type: object
      required: [purchaseDate, amount, speditionName, reference, note]
      properties:
        purchaseDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        amount: { type: integer, minimum: 1, maximum: 2147483647 }
        speditionName: { type: string, minLength: 1, maxLength: 200 }
        reference: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        expectedUpdatedAt: { type: string }
    PalletPurchase:
      allOf:
        - { $ref: "#/components/schemas/PalletPurchaseInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            updatedAt: { type: string }
    PalletPurchaseDeletion:
      type: object
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string }
    ClockEmployeeCreateInput:
      type: object
      required: [firstName, lastName, provider, activity, active]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, maxLength: 150 }
        activity: { type: string, maxLength: 150 }
        active: { type: boolean }
    ClockEmployeeInput:
      type: object
      required: [cardNumber, firstName, lastName, provider, activity, active]
      properties:
        cardNumber: { type: string, minLength: 1, maxLength: 80 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, maxLength: 150 }
        activity: { type: string, maxLength: 150 }
        active: { type: boolean }
        expectedUpdatedAt: { type: string }
    ClockVersion:
      type: object
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string }
    ClockShiftInput:
      type: object
      required: [name, startTime, endTime, pauseMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        startTime: { type: string }
        endTime: { type: string }
        pauseMinutes: { type: integer, minimum: 0, maximum: 1439 }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", description: "Display color; omitted values retain the existing color or default to blue" }
    ClockShiftUpdate:
      allOf:
        - { $ref: "#/components/schemas/ClockShiftInput" }
        - { $ref: "#/components/schemas/ClockVersion" }
    ClockShift:
      allOf:
        - { $ref: "#/components/schemas/ClockShiftInput" }
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: integer }
            updatedAt: { type: string }
    ClockShiftAssignmentInput:
      type: object
      required: [employeeId, startsOn, endsOn, weekdays, shiftIds]
      properties:
        employeeId: { type: integer, minimum: 1 }
        startsOn: { type: string }
        endsOn: { type: ["string", "null"] }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        shiftIds:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: integer, minimum: 1 }
    ClockShiftAssignmentsInput:
      type: object
      required: [employeeIds, startsOn, endsOn, weekdays, shiftIds]
      properties:
        employeeIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        startsOn: { type: string }
        endsOn: { type: ["string", "null"] }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        shiftIds:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: integer, minimum: 1 }
    ClockShiftAssignmentUpdate:
      allOf:
        - { $ref: "#/components/schemas/ClockShiftAssignmentInput" }
        - { $ref: "#/components/schemas/ClockVersion" }
    ClockShiftAssignment:
      allOf:
        - { $ref: "#/components/schemas/ClockShiftAssignmentInput" }
        - type: object
          required: [id, anchorMonday, updatedAt]
          properties:
            id: { type: integer }
            anchorMonday: { type: string }
            updatedAt: { type: string }
    ClockShiftExceptionInput:
      type: object
      required: [employeeId, startsOn, endsOn, weekdays, shiftId, note]
      properties:
        employeeId: { type: integer, minimum: 1 }
        startsOn: { type: string }
        endsOn: { type: string }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        shiftId: { type: ["integer", "null"], minimum: 1 }
        note: { type: string, maxLength: 500 }
    ClockShiftExceptionUpdate:
      allOf:
        - { $ref: "#/components/schemas/ClockShiftExceptionInput" }
        - { $ref: "#/components/schemas/ClockVersion" }
    ClockShiftException:
      allOf:
        - { $ref: "#/components/schemas/ClockShiftExceptionInput" }
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: integer }
            updatedAt: { type: string }
    ClockShiftDay:
      type: object
      required: [employeeId, day, shiftId, shiftName, startsAt, endsAt, plannedMinutes, source]
      properties:
        employeeId: { type: integer }
        day: { type: string }
        shiftId: { type: ["integer", "null"] }
        shiftName: { type: ["string", "null"] }
        startsAt: { type: ["string", "null"] }
        endsAt: { type: ["string", "null"] }
        plannedMinutes: { type: integer }
        source: { type: string, enum: [assignment, exception, none] }
    ClockShiftPlanning:
      type: object
      required: [shifts, assignments, exceptions, employees, days]
      properties:
        shifts: { type: array, items: { $ref: "#/components/schemas/ClockShift" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/ClockShiftAssignment" } }
        exceptions: { type: array, items: { $ref: "#/components/schemas/ClockShiftException" } }
        employees: { type: array, items: { $ref: "#/components/schemas/ClockEmployee" } }
        days: { type: array, items: { $ref: "#/components/schemas/ClockShiftDay" } }
    ClockEmployee:
      allOf:
        - { $ref: "#/components/schemas/ClockEmployeeInput" }
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: integer }
            updatedAt: { type: string }
    ClockBreakRule:
      type: object
      required: [fromMinutes, deductionMinutes]
      properties:
        fromMinutes: { type: integer, minimum: 0, maximum: 10080 }
        deductionMinutes: { type: integer, minimum: 0, maximum: 1440 }
    ClockSettings:
      type: object
      required: [earliestStart, latestEnd, breakRules, terminalHours, debounceSeconds, updatedAt]
      properties:
        earliestStart: { type: ["string", "null"] }
        latestEnd: { type: ["string", "null"] }
        breakRules:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ClockBreakRule" }
        terminalHours:
          type: ["integer", "null"]
          minimum: 1
          maximum: 168
          description: Laufzeit für neue Terminalfreigaben in Stunden; null bedeutet unbegrenzt.
        debounceSeconds: { type: integer, minimum: 5, maximum: 120 }
        updatedAt: { type: string }
    ClockEntryInput:
      type: object
      required: [employeeId, startedAt, endedAt, pauseOverride, reason]
      properties:
        employeeId: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        pauseOverride: { type: ["integer", "null"], minimum: 0, maximum: 1440 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        expectedUpdatedAt: { type: string }
    ClockEntryUpdate:
      type: object
      required: [employeeId, startedAt, endedAt, pauseOverride]
      properties:
        employeeId: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        pauseOverride: { type: ["integer", "null"], minimum: 0, maximum: 1440 }
        reason: { type: string, maxLength: 1000 }
        expectedUpdatedAt: { type: string }
    ClockEntry:
      type: object
      required: [id, employeeId, cardNumber, firstName, lastName, provider, activity, startedAt, endedAt, originalStartedAt, originalEndedAt, bookedStart, bookedEnd, grossMinutes, pauseMinutes, netMinutes, pauseOverride, source, updatedAt]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        cardNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        provider: { type: string }
        activity: { type: string }
        startedAt: { type: string }
        endedAt: { type: ["string", "null"] }
        originalStartedAt: { type: string }
        originalEndedAt: { type: ["string", "null"] }
        shiftName: { type: ["string", "null"] }
        shiftDay: { type: ["string", "null"] }
        shiftStart: { type: ["string", "null"] }
        shiftEnd: { type: ["string", "null"] }
        bookedStart: { type: string }
        bookedEnd: { type: ["string", "null"] }
        grossMinutes: { type: ["integer", "null"] }
        pauseMinutes: { type: ["integer", "null"] }
        netMinutes: { type: ["integer", "null"] }
        pauseOverride: { type: ["integer", "null"] }
        source: { type: string }
        reason: { type: string, description: Current optional entry reason }
        updatedAt: { type: string }
    ClockDeletion:
      type: object
      required: [reason, expectedUpdatedAt]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
        expectedUpdatedAt: { type: string }
    ClockAudit:
      type: object
      required: [id, action, actor, reason, createdAt, before, after]
      properties:
        id: { type: integer }
        action: { type: string }
        actor: { type: string }
        reason: { type: string }
        createdAt: { type: string }
        before: { type: ["object", "null"], additionalProperties: true }
        after: { type: ["object", "null"], additionalProperties: true }
    ClockState:
      type: object
      required: [employees, entries, audit]
      properties:
        employees:
          type: array
          items: { $ref: "#/components/schemas/ClockEmployee" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ClockEntry" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/ClockAudit" }
    ClockTerminalInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
    ClockTerminal:
      type: object
      required: [unlocked, id, label, expiresAt]
      properties:
        unlocked: { type: boolean }
        id: { type: ["integer", "null"] }
        label: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
    ClockStampInput:
      type: object
      required: [cardNumber, requestId]
      properties:
        cardNumber: { type: string, minLength: 1, maxLength: 80 }
        requestId: { type: string, minLength: 16, maxLength: 100 }
    ClockStampResult:
      type: object
      required: [action, name, time, bookedTime]
      properties:
        action: { type: string, enum: [in, out] }
        name: { type: string }
        time: { type: string }
        bookedTime: { type: string }
    ClockLegacyEntry:
      type: object
      required: [legacyId, cardNumber, startedAt, endedAt]
      properties:
        legacyId: { type: string, minLength: 1, maxLength: 100 }
        cardNumber: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
    ClockImportInput:
      type: object
      required: [employees, entries, legacyTimesAcknowledged]
      properties:
        employees:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/ClockEmployeeInput" }
        entries:
          type: array
          maxItems: 50000
          items: { $ref: "#/components/schemas/ClockLegacyEntry" }
        legacyTimesAcknowledged: { type: boolean }
    ClockImportResult:
      type: object
      required: [employeesAdded, entriesAdded, skipped, errors]
      properties:
        employeesAdded: { type: integer }
        entriesAdded: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { type: string }
    ShipmentWorkViewDateRange:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [today, tomorrow, thisWeek, all] }
        - type: object
          additionalProperties: false
          required: [mode, from, to]
          properties:
            mode: { type: string, enum: [custom] }
            from: { type: string, pattern: '^(?:[1-9]\d{3}-\d{2}-\d{2})?$' }
            to: { type: string, pattern: '^(?:[1-9]\d{3}-\d{2}-\d{2})?$' }
    ShipmentWorkViewFilterValues:
      type: object
      additionalProperties: false
      required: [search, status, speditionId, lkwArt, tor, date, sortField, sortDir, showAbgefertigt, showStorniert]
      properties:
        search: { type: string, maxLength: 200 }
        status: { type: string, enum: ["__all__", Angemeldet, Erwartet, Angekommen, "in Verladung", Verladen, Abgefertigt, Storniert] }
        speditionId: { type: string, pattern: '^(?:__all__|[1-9]\d{0,9})$' }
        lkwArt: { type: string, minLength: 1, maxLength: 100 }
        tor: { type: string, minLength: 1, maxLength: 100 }
        date: { $ref: "#/components/schemas/ShipmentWorkViewDateRange" }
        sortField: { type: string, enum: [kennzeichen, etaDate, status, tor, speditionName] }
        sortDir: { type: string, enum: [asc, desc] }
        showAbgefertigt: { type: boolean }
        showStorniert: { type: boolean }
    ShipmentWorkViewEntry:
