        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [comet_admin, comet_leitstand, comet_lager, comet_viewer, speditions_admin, speditions_bearbeiter, speditions_viewer]
        speditionId:
          type: ["integer", "null"]
        speditionName:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
