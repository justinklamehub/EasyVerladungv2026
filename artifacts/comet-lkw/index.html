<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>COMET LKW-Verladungsverwaltung</title>
    <meta name="description" content="Digitale Steuerung aller LKW-Verladungen — COMET LKW-Verladungsverwaltung." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="COMET LKW-Verladungsverwaltung" />
    <meta property="og:description" content="Digitale Steuerung aller LKW-Verladungen — COMET LKW-Verladungsverwaltung." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="COMET LKW-Verladungsverwaltung" />
    <meta name="twitter:description" content="Digitale Steuerung aller LKW-Verladungen — COMET LKW-Verladungsverwaltung." />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="COMET LKW" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Available immediately, before the app bundle or its styles have loaded. -->
    <style>
      .comet-startup {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .comet-startup-content {
        width: 100%;
        max-width: 360px;
      }
      .comet-startup-spinner {
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        margin: 0 auto 24px;
        border: 4px solid #e2e8f0;
        border-top-color: #0f172a;
        border-radius: 50%;
        animation: comet-startup-spin 0.9s linear infinite;
      }
      .comet-startup-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.5;
      }
      .comet-startup-hint {
        margin: 8px 0 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
      }
      @keyframes comet-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .comet-startup-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="comet-startup" role="status" aria-live="polite" aria-atomic="true" aria-busy="true">
        <div class="comet-startup-content">
          <div class="comet-startup-spinner" aria-hidden="true"></div>
          <p class="comet-startup-title">Aktuelle App-Version wird geladen…</p>
          <p class="comet-startup-hint">Einen Moment bitte.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
